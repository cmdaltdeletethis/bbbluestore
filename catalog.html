<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>catalog | baby blue</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-baby sticky-top py-3">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">baby blue</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
          aria-label="toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul
            class="navbar-nav ms-auto align-items-lg-center gap-2 gap-lg-3 mt-3 mt-lg-0"
          >
            <li class="nav-item">
              <a class="nav-link fw-bold" href="index.html">home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link fw-bold active" href="catalog.html">catalog</a>
            </li>
            <li class="nav-item">
              <a class="nav-link fw-bold" href="contact.html">contact us</a>
            </li>
            <li class="nav-item">
              <button
                class="btn btn-baby btn-sm px-3 py-2 mobile-full-btn"
                data-bs-toggle="modal"
                data-bs-target="#cartModal"
              >
                cart (<span data-cart-count>0</span>)
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-4 my-md-5">
      <div class="mb-4">
        <h1 class="fw-bold mb-1">product catalog</h1>
        <p class="text-muted mb-0" id="result-count">
          showing 6 baby blue-colored items
        </p>
      </div>

      <div class="row g-3 align-items-center mb-4">
        <div class="col-12 col-md-7 d-flex flex-wrap gap-2">
          <button
            class="btn btn-outline-baby btn-sm px-3 py-2 active"
            data-category="All"
          >
            all
          </button>
          <button
            class="btn btn-outline-baby btn-sm px-3 py-2"
            data-category="Desk"
          >
            desk
          </button>
          <button
            class="btn btn-outline-baby btn-sm px-3 py-2"
            data-category="Apparel"
          >
            apparel
          </button>
          <button
            class="btn btn-outline-baby btn-sm px-3 py-2"
            data-category="Home"
          >
            home
          </button>
        </div>
        <div class="col-12 col-md-5">
          <input
            type="search"
            id="search-input"
            class="form-control border-2"
            placeholder="Search baby blue items..."
          />
        </div>
      </div>

      <div id="catalog-grid" class="row g-4"></div>
    </main>

    <div class="modal fade" id="cartModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-2">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">your baby blue-colored cart</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div id="cart-items-container"></div>
            <div
              id="checkout-success"
              class="alert alert-info mt-3 d-none small"
            >
              order placed! your cart has been cleared locally.
            </div>
          </div>
          <div class="modal-footer justify-content-between">
            <div class="fw-bold">
              subtotal: <span id="cart-subtotal">$0.00</span>
            </div>
            <div class="d-flex gap-2">
              <button
                type="button"
                class="btn btn-outline-secondary btn-sm"
                onclick="clearCart()"
              >
                clear
              </button>
              <button
                type="button"
                id="demo-checkout-btn"
                class="btn btn-baby btn-sm px-3"
              >
                checkout
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="py-4 mt-5">
      <div
        class="container d-flex flex-column flex-sm-row justify-content-between align-items-center text-center text-sm-start gap-2"
      >
        <span class="small fw-bold"
          >baby blue — front-end academic project</span
        >
        <span class="small">html • css • bootstrap 5 • vanilla js</span>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
